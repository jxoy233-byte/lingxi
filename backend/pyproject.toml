[project]
name = "ChatMe"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.2",
    "chardet==5.2.0",
    "docling>=2.84.0",
    "fastapi>=0.135.1",
    "fastmcp>=3.1.1",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.20",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.1.11",
    "langchain-tavily>=0.2.17",
    "langgraph>=1.1.3",
    "langgraph-checkpoint-redis>=0.4.0",
    "langgraph-sdk>=0.3.12",
    "oss2>=2.19.1",
    "qwen-vl-utils>=0.0.14",
    "redis>=7.3.0",
    "redisvl>=0.16.0",
]

[project.scripts]
chatme_main = "main:main"
chatme_mcp = "ChatMe.ChatWorkflow.mcps.server:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ChatMe*", "skills*"]
exclude = ["ChatMe.test*", "*.test*"]