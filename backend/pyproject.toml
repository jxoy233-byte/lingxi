[project]
name = "ChatMe"
version = "0.1.8"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.2",
    "chardet==5.2.0",
    "docling>=2.84.0",
    "fastapi>=0.135.1",
    "fastmcp>=3.1.1",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.20",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.1.11",
    "langchain-tavily>=0.2.17",
    "unstructured>=0.16.0",
    "langgraph>=1.1.3",
    "langgraph-checkpoint-redis>=0.4.0",
    "langgraph-sdk>=0.3.12",
    "oss2>=2.19.1",
    "qwen-vl-utils>=0.0.14",
    "redis>=7.3.0",
    "redisvl>=0.16.0",
    "altair>=6.1.0",
    "beautifulsoup4>=4.14.3",
    "bokeh>=3.9.0",
    "branca>=0.8.2",
    "folium>=0.20.0",
    "jinja2>=3.1.6",
    "joblib>=1.5.3",
    "lxml>=6.1.1",
    "markupsafe>=3.0.3",
    "matplotlib>=3.10.9",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "plotly>=6.8.0",
    "pyecharts>=2.1.0",
    "pygal>=3.1.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "sympy>=1.14.0",
    "xlrd>=2.0.2",
    "xyzservices>=2026.3.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
chatme_main = "main:main"
chatme_mcp = "ChatMe.ChatWorkflow.mcps.server:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ChatMe*", "skills*"]
exclude = ["ChatMe.test*", "*.test*"]

[tool.setuptools.package-data]
skills = ["**/SKILL.md"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
